{% extends "auth_base.html" %}
{% block title %}Forgot password · {{ app_name }}{% endblock %}
{% block content %}
<h1 class="auth-title">{{ _('Forgot password?') }}</h1>
<p class="auth-sub">Enter your email or username. If an account matches, an administrator will send you a reset link.</p>

<form class="form-stack auth-form" method="post" action="{{ url_for('forgot_password') }}">
  <label class="field">
    <span class="field-label">Email or username</span>
    <input type="text" name="login" required autocomplete="username" autofocus placeholder="admin or you@example.com">
  </label>
  <button type="submit" class="btn btn--primary btn--block">Send reset link</button>
</form>

<p class="auth-switch">
  <a href="{{ url_for('login') }}">{{ _('Sign in') }}</a>
</p>
{% endblock %}
