{% extends "auth_base.html" %}
{% block title %}Reset password · {{ app_name }}{% endblock %}
{% block content %}
<h1 class="auth-title">Choose a new password</h1>
<p class="auth-sub">This link works once. After you save, sign in with the new password.</p>

<form class="form-stack auth-form" method="post" action="{{ url_for('reset_password', token=token) }}">
  <label class="field">
    <span class="field-label">New password</span>
    <input type="password" name="password" required autocomplete="new-password" minlength="8" autofocus placeholder="••••••••">
  </label>
  <label class="field">
    <span class="field-label">Confirm password</span>
    <input type="password" name="confirm" required autocomplete="new-password" minlength="8" placeholder="••••••••">
  </label>
  <button type="submit" class="btn btn--primary btn--block">Update password</button>
</form>

<p class="auth-switch">
  <a href="{{ url_for('login') }}">{{ _('Sign in') }}</a>
</p>
{% endblock %}
