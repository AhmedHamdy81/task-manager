{% set wa = workflow_active|default('overview') %}
<nav class="project-workflow-nav" aria-label="Production workflow">
  <a class="project-workflow-nav-link{% if wa == 'overview' %} project-workflow-nav-link--active{% endif %}" href="{{ url_for('project_detail', project_id=project.id) }}">Overview</a>
  <a class="project-workflow-nav-link{% if wa == 'episodes' %} project-workflow-nav-link--active{% endif %}" href="{{ url_for('project_episodes', project_id=project.id) }}">Episodes</a>
  <a class="project-workflow-nav-link{% if wa == 'shooting' %} project-workflow-nav-link--active{% endif %}" href="{{ url_for('project_production', project_id=project.id) }}">Shooting days</a>
  <a class="project-workflow-nav-link{% if wa == 'vfx' %} project-workflow-nav-link--active{% endif %}" href="{{ url_for('project_vfx', project_id=project.id) }}">VFX Management</a>
  <a class="project-workflow-nav-link{% if wa == 'audio' %} project-workflow-nav-link--active{% endif %}" href="{{ url_for('project_audio_library', project_id=project.id) }}">Audio Library</a>
  <a class="project-workflow-nav-link{% if wa == 'post' %} project-workflow-nav-link--active{% endif %}" href="{{ url_for('booking.booking_home') }}?project_id={{ project.id }}">Post production</a>
</nav>
