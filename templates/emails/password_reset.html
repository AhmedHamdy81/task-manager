<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px;background:#0f1419;color:#e8edf2;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#1a222c;border:1px solid #2f3d4d;border-radius:12px;padding:32px">
            <tr><td>
              <h1 style="margin:0 0 16px;font-size:24px;color:#e8edf2">Reset your password</h1>
              <p style="margin:0 0 24px;line-height:1.6;color:#b9c4cf">A password reset was requested for your {{ app_name }} account.</p>
              <p style="margin:0 0 24px">
                <a href="{{ reset_url }}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#3d9a7a;color:#fff;text-decoration:none;font-weight:700">Reset password</a>
              </p>
              <p style="margin:0 0 12px;line-height:1.6;color:#b9c4cf">This link expires in {{ expires_minutes }} minutes and can only be used once.</p>
              <p style="margin:0;line-height:1.6;color:#8b9aab">If you did not request this change, ignore this email. Your password will remain unchanged.</p>
            </td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
